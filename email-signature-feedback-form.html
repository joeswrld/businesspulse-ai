<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form - Email Signature</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .feedback-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            position: relative;
            overflow: hidden;
        }
        
        .feedback-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f093fb, #f5576c);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #1f2937;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #6b7280;
            font-size: 16px;
        }
        
        .email-badge {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 10px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group label .required {
            color: #dc2626;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #f093fb;
            box-shadow: 0 0 0 3px rgba(240, 147, 251, 0.1);
        }
        
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(240, 147, 251, 0.3);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .submit-btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-weight: 500;
            display: none;
        }
        
        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        
        .footer p {
            color: #6b7280;
            font-size: 14px;
        }
        
        .optional-fields {
            background: #f9fafb;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
        }
        
        .optional-fields h3 {
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        @media (max-width: 640px) {
            .feedback-container {
                padding: 24px;
                margin: 10px;
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="feedback-container">
        <div class="header">
            <h1>Quick Feedback</h1>
            <p>Help us improve by sharing your thoughts</p>
            <div class="email-badge">Email Signature Form</div>
        </div>
        
        <form id="feedbackForm">
            <div class="optional-fields">
                <h3>Optional Information</h3>
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com">
                </div>
            </div>
            
            <div class="form-group">
                <label for="message">Your Feedback <span class="required">*</span></label>
                <textarea id="message" name="message" placeholder="What's on your mind? Share your feedback here..." required></textarea>
            </div>
            
            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="spinner" id="spinner"></span>
                <span id="btnText">Send Feedback</span>
            </button>
            
            <div class="message" id="messageDiv"></div>
        </form>
        
        <div class="footer">
            <p>Your feedback is valuable to us</p>
        </div>
    </div>

    <script>
        // Configuration - Update these values
        const SUPABASE_URL = 'https://xjbrqeqizpoqdjkiyqzt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqYnJxZXFpenBvcWRqa2l5cXp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTUwNTAzMjcsImV4cCI6MjA3MDYyNjMyN30.cxMH9tUGYEOTUauzluSEeNyjG1iMtUZnNIj4QYGNi84';
        const PROJECT_ID = 'your-project-id'; // Replace with your actual project ID
        
        // Get project ID from URL parameter if available
        const urlParams = new URLSearchParams(window.location.search);
        const projectIdFromUrl = urlParams.get('project_id');
        if (projectIdFromUrl) {
            PROJECT_ID = projectIdFromUrl;
        }
        
        class EmailSignatureFeedbackForm {
            constructor() {
                this.form = document.getElementById('feedbackForm');
                this.submitBtn = document.getElementById('submitBtn');
                this.spinner = document.getElementById('spinner');
                this.btnText = document.getElementById('btnText');
                this.messageDiv = document.getElementById('messageDiv');
                
                this.init();
            }
            
            init() {
                this.form.addEventListener('submit', (e) => this.handleSubmit(e));
            }
            
            async handleSubmit(e) {
                e.preventDefault();
                
                const formData = new FormData(this.form);
                const data = {
                    name: formData.get('name')?.trim() || null,
                    email: formData.get('email')?.trim() || null,
                    message: formData.get('message').trim()
                };
                
                // Validate required fields
                if (!data.message) {
                    this.showMessage('Please enter your feedback message.', 'error');
                    return;
                }
                
                // Validate email if provided
                if (data.email && !this.isValidEmail(data.email)) {
                    this.showMessage('Please enter a valid email address.', 'error');
                    return;
                }
                
                this.setLoading(true);
                this.hideMessage();
                
                try {
                    await this.submitFeedback(data);
                    this.showMessage('Thank you for your feedback! We appreciate your input.', 'success');
                    this.form.reset();
                } catch (error) {
                    console.error('Error submitting feedback:', error);
                    this.showMessage('Failed to submit feedback. Please try again.', 'error');
                } finally {
                    this.setLoading(false);
                }
            }
            
            async submitFeedback(data) {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/insert_feedback_safe`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    },
                    body: JSON.stringify({
                        p_project_id: PROJECT_ID,
                        p_channel: 'email_signature',
                        p_name: data.name,
                        p_email: data.email,
                        p_message: data.message
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                return await response.json();
            }
            
            isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }
            
            setLoading(loading) {
                this.submitBtn.disabled = loading;
                this.spinner.style.display = loading ? 'inline-block' : 'none';
                this.btnText.textContent = loading ? 'Sending...' : 'Send Feedback';
            }
            
            showMessage(text, type) {
                this.messageDiv.textContent = text;
                this.messageDiv.className = `message ${type}`;
                this.messageDiv.style.display = 'block';
                
                // Auto-hide success messages
                if (type === 'success') {
                    setTimeout(() => this.hideMessage(), 5000);
                }
            }
            
            hideMessage() {
                this.messageDiv.style.display = 'none';
            }
        }
        
        // Initialize the form when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new EmailSignatureFeedbackForm();
        });
    </script>
</body>
</html>
