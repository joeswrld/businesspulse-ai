<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Submission Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>
    <h1>Feedback Submission Test</h1>
    <p>Test feedback submission to verify the API is working correctly.</p>
    
    <form id="feedbackForm">
        <div class="form-group">
            <label for="projectId">Project ID:</label>
            <input type="text" id="projectId" name="project_id" required placeholder="Enter your project ID">
        </div>
        
        <div class="form-group">
            <label for="name">Name (optional):</label>
            <input type="text" id="name" name="name" placeholder="Your name">
        </div>
        
        <div class="form-group">
            <label for="email">Email (optional):</label>
            <input type="email" id="email" name="email" placeholder="your@email.com">
        </div>
        
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required placeholder="Your feedback message"></textarea>
        </div>
        
        <button type="submit" id="submitBtn">Submit Feedback</button>
    </form>
    
    <div id="result" class="result" style="display: none;"></div>
    
    <script>
        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            resultDiv.style.display = 'none';
            
            try {
                const formData = new FormData(e.target);
                
                console.log('Submitting feedback:', {
                    projectId: formData.get('project_id'),
                    name: formData.get('name'),
                    email: formData.get('email'),
                    message: formData.get('message')
                });
                
                const response = await fetch('https://xjbrqeqizpoqdjkiyqzt.supabase.co/functions/v1/feedback-api', {
                    method: 'POST',
                    body: formData
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', Object.fromEntries(response.headers.entries()));
                
                const result = await response.json();
                console.log('Response data:', result);
                
                if (response.ok && result.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Success!</h3>
                        <p><strong>Message:</strong> ${result.message}</p>
                        <p><strong>Feedback ID:</strong> ${result.data.id}</p>
                        <p><strong>Timestamp:</strong> ${new Date(result.data.timestamp).toLocaleString()}</p>
                    `;
                    e.target.reset();
                } else {
                    throw new Error(result.error || `HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                console.error('Submission error:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>Check the browser console for more details.</p>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Feedback';
                resultDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
